<html lang="es">
<head>
    <meta charset="UTF-8">

<meta name="keywords" content="Menú del día puerto valencia, almorzar puerto valencia, restaurante el grao, arroces valencia puerto">

    },

    },

        {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "07:30",

        },
        {

        "dayOfWeek": "Saturday",
        "opens": "09:00",

</script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="logo.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="msapplication-TileColor" content="#e63946">
    <meta name="theme-color" content="#e63946">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --red: #e63946; --black: #1a1a1a; --white: #ffffff; --gray: #f4f4f4; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--gray); color: var(--black); line-height: 1.6; }
        
        header { background: var(--black); color: var(--white); text-align: center; padding: 30px 0; border-bottom: 5px solid var(--red); }
        h1 { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px;  }
        h1 span { color: var(--red); }

        .container { width: 90%; max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 4px; font-size: 1rem; background: white; }
        input:focus, select:focus { border-color: var(--red); outline: none; }

        .btn-reserva { width: 100%; padding: 15px; background: var(--red); color: white; border: none; border-radius: 4px; font-weight: 700; font-size: 1rem; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        .btn-reserva:hover { background: #b52b35; transform: translateY(-2px); }

        #mensaje { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; text-align: center; font-weight: 700; }
        .msg-error { background: #ffe3e5; color: var(--red); border: 1px solid var(--red); }
        .msg-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: var(--black); text-decoration: none; font-weight: 700; font-size: 0.8rem; }

        /* language select styling (shared with other pages) */
        .btn-lang {
            background: transparent;
            border: 1px solid var(--red);
            color: white;
            padding: 5px 12px;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            border-radius: 4px;
            margin-left: 15px;
            transition: 0.3s;
        }
        .btn-lang:hover { background: var(--red); }
    </style>
</head>
<body>

<header>
    <div>
        <h1 data-i18n="reservas.title">HACER UNA <span>RESERVA</span></h1>
    </div>
</header>

<div class="container">
    <div style="display:none" id="i18n-messages">
        <span data-i18n="msg.closedSunday"></span>
        <span data-i18n="msg.noTables"></span>
        <span data-i18n="msg.reserved"></span>
    </div>
    <form id="reservaForm">
        <div class="form-group">
            <label data-i18n="label.name">Nombre del Cliente</label>
            <input type="text" id="nombre" data-i18n-placeholder="label.name" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
            <label data-i18n="label.phone">Teléfono de Contacto</label>
            <input type="tel" id="tel_cliente" data-i18n-placeholder="label.phone" placeholder="Ej: 600000000" required>
        </div>

        <div class="form-group">
            <label data-i18n="label.zone">Zona</label>
            <select id="zona" required>
                <option value="Interior" data-i18n="option.interior">Interior 🏠</option>
                <option value="Terraza" data-i18n="option.terraza">Terraza ☀️</option>
            </select>
        </div>

        <div class="form-group">
            <label data-i18n="label.day">Día</label>
            <input type="date" id="fecha" required>
        </div>

        <div class="form-group">
            <label data-i18n="label.time">Hora</label>
            <select id="hora" required>
                <option value="" data-i18n="select.timePlaceholder">Selecciona un día primero...</option>
            </select>
        </div>

        <div class="form-group">
            <label data-i18n="label.people">Nº de Personas</label>
            <input type="number" id="personas" min="1" max="10" value="2" required>
        </div>

        <button type="submit" class="btn-reserva" data-i18n="btn.confirmReserva">Confirmar por WhatsApp 💬</button>
    </form>

    <div id="mensaje"></div>
    <a href="index.html" class="back-link" data-i18n="btn.back">← VOLVER AL INICIO</a>
</div>

<script>
    const form = document.getElementById('reservaForm');
    const mensaje = document.getElementById('mensaje');
    const fechaInput = document.getElementById('fecha');
    const horaSelect = document.getElementById('hora');

    // CONFIGURACIÓN (Tu número con prefijo de España)
    const TELEFONO_RESTAURANTE = "34633167416"; 

    // No permitir fechas pasadas
    const hoy = new Date().toISOString().split('T')[0];
    fechaInput.setAttribute('min', hoy);

    // Lógica de horarios según el día de la semana
    fechaInput.addEventListener('change', function() {
        const fechaSeleccionada = new Date(this.value);
        const diaSemana = fechaSeleccionada.getDay(); // 0 es domingo
    horaSelect.innerHTML = '<option value="" data-i18n="select.timePlaceholder">Selecciona una hora...</option>';
        let inicio = 0, fin = 0;

        if (diaSemana >= 1 && diaSemana <= 5) { // Lunes a Viernes
            inicio = 8; fin = 16; 
        } else if (diaSemana === 6) { // Sábados
            inicio = 9; fin = 16; 
        } else if (diaSemana === 0) { // Domingos Cerrado
            mostrarMensaje('i18n:msg.closedSunday', "msg-error");
            this.value = "";
            return;
        }

        for (let i = inicio; i <= fin; i++) {
            const horaLabel = `${i < 10 ? '0' + i : i}:00`;
            const option = document.createElement('option');
            option.value = horaLabel;
            option.textContent = horaLabel;
            horaSelect.appendChild(option);
        }
        mensaje.style.display = "none";
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const datos = {
            nombre: document.getElementById('nombre').value,
            tel_cliente: document.getElementById('tel_cliente').value,
            zona: document.getElementById('zona').value,
            fecha: fechaInput.value,
            hora: horaSelect.value,
            personas: document.getElementById('personas').value
        };

        // Guardado local y comprobación de huecos (máx 15 por turno)
        let db = JSON.parse(localStorage.getItem('reservas_grao')) || [];
        const ocupacion = db.filter(r => r.fecha === datos.fecha && r.hora === datos.hora && r.zona === datos.zona).length;

        if (ocupacion >= 15) {
            mostrarMensaje(`i18n:msg.noTables|${datos.zona}`, "msg-error");
        } else {
            db.push(datos);
            localStorage.setItem('reservas_grao', JSON.stringify(db));

            // MENSAJE PARA WHATSAPP CON EMOJIS Y FORMATO
            const textoWhatsApp = 
                `🍽️ *NUEVA RESERVA WEB*\n` +
                `--------------------------\n` +
                `👤 *Nombre:* ${datos.nombre}\n` +
                `📞 *Teléfono:* ${datos.tel_cliente}\n` +
                `📍 *Zona:* ${datos.zona}\n` +
                `📅 *Fecha:* ${datos.fecha}\n` +
                `⏰ *Hora:* ${datos.hora}\n` +
                `👥 *Personas:* ${datos.personas}\n\n` +
                `✨ _Por favor, confirmadme disponibilidad. ¡Gracias!_`;

            // encodeURIComponent hace que los emojis y saltos de línea funcionen
            const urlWhatsApp = `https://wa.me/${TELEFONO_RESTAURANTE}?text=${encodeURIComponent(textoWhatsApp)}`;

            mostrarMensaje('i18n:msg.reserved', "msg-success");
            
            setTimeout(() => {
                window.open(urlWhatsApp, '_blank');
                form.reset();
                horaSelect.innerHTML = '<option value="" data-i18n="select.timePlaceholder">Selecciona un día primero...</option>';
            }, 1200);
        }
    });

    function mostrarMensaje(texto, clase) {
        let finalText = texto;
        if (typeof texto === 'string' && texto.startsWith('i18n:')) {
            const payload = texto.slice(5);
            let key = payload;
            let param = null;
            if (payload.indexOf('|') !== -1) {
                [key, param] = payload.split('|');
            }
            const el = document.querySelector('[data-i18n="' + key + '"]');
            finalText = el ? el.innerText : key;
            if (param) finalText = finalText.replace('{zona}', param);
        }
        mensaje.innerText = finalText;
        mensaje.className = clase;
        mensaje.style.display = "block";
    }
</script>

<!-- Removed i18n (site stays Spanish-only) -->

</body>
</html>
